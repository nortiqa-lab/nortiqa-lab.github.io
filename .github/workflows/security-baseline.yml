name: Security Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.lock' ':!package-lock.json'; then
            echo 'Merge-conflict markers found.' >&2
            exit 1
          fi
      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+)' -- .; then
            echo 'Potential secret material found.' >&2
            exit 1
          fi
